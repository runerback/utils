server {
    listen 80;
    listen [::]:80;
    server_name ${RSS_BRIDGE_HOST};

    root ${RSS_BRIDGE_ROOT};
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:cache|config|lib|vendor)(?:/|$) {
        deny all;
    }

    location = /config.ini.php {
        deny all;
    }

    location = /config.default.ini.php {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:ini|log|md|sql|sh|ya?ml)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:${PHP_FPM_SOCKET};
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
