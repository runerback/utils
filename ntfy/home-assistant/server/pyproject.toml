[project]
name = "home-assistant"
version = "0.1.0"
description = "Home Assistant dashboard server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-pam>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "bleak>=0.21",
    "qrcode[pil]>=7.4",
    "zeroconf>=0.132",
    "pyserial>=3.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
